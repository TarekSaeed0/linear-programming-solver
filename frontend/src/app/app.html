<router-outlet />

<main class="flex flex-col items-center p-4">
  <div class="flex flex-col gap-2 p-6 rounded-md bg-gray-100 shadow-md">
    <h1 class="text-2xl font-bold">Problem Input</h1>
    <div>
      <h2 class="text-lg font-semibold mb-1">Objective</h2>
      <app-objective-input [variables]="variables" />
    </div>
    <div>
      <h2 class="text-lg font-semibold mb-1">Constraints</h2>
      <app-constraints-input [variables]="variables" />
    </div>
    <div>
      <h2 class="text-lg font-semibold mb-1">Variables</h2>
      <app-variables-input 
        [variables]="variables" 
        (variablesChange)="onVariablesChange($event)" />    </div>
  </div>
</main>
