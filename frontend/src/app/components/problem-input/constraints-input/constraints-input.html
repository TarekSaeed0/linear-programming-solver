<div class="flex flex-col gap-2">
  <div
    class="grid gap-y-1.5 items-center justify-items-center w-fit"
    [style.gridTemplateColumns]="'repeat(' + (variables().length * 3 + 2) + ', auto)'"
  >
    @for (i of form.length | range; track $index) {
      <button
        class="mr-2 p-1 rounded-full"
        type="button"
        title="Remove Constraint"
        (click)="removeConstraint(i)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
          />
        </svg>
      </button>

      @for (j of form.at(i).controls.coefficients.length | range; track $index) {
        <input
          #input
          class="min-w-full h-fit"
          type="text"
          placeholder="0"
          [formControl]="form.at(i).controls.coefficients.at(j)"
          autoSizeInput
          [extraWidth]="10"
          (keydown)="onKeyDown(i, j, $event)"
        />

        <math class="ml-1">
          <msub>
            <mi>{{ variables()[j].name.name }}</mi>
            @if (variables()[j].name.index !== null) {
              <mn> {{ variables()[j].name.index }} </mn>
            }
          </msub>
        </math>

        @if (j < variables().length - 1) {
          <math>
            <mo>+</mo>
          </math>
        }
      }

      <select class="ml-1 mr-2" [formControl]="form.at(i).controls.type">
        @for (constraintType of constraintTypes; track constraintType.value) {
          <option [value]="constraintType.value">
            <span [innerHTML]="constraintType.label"></span>
          </option>
        }
      </select>

      <input
        #input
        class="min-w-full h-fit"
        type="text"
        placeholder="0"
        [formControl]="form.at(i).controls.constant"
        autoSizeInput
        [extraWidth]="10"
        (keydown)="onKeyDown(i, variables().length, $event)"
      />
    }
  </div>

  <button
    class="flex items-center gap-1"
    type="button"
    title="Add Constraint"
    (click)="addConstraint()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="size-4"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
    Constraint
  </button>
</div>
