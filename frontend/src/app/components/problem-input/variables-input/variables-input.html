<div class="flex flex-col gap-2">
  @for (variable of variables(); track variable.name.index; let i = $index) {
    <div class="flex items-center gap-3">
      <math class="w-6 text-center text-lg font-semibold">
        <msub>
          <mi>{{ variable.name.name }}</mi>
          @if (variable.name.index !== null) {
            <mn>{{ variable.name.index }}</mn>
          }
        </msub>
      </math>

      <select class="p-1 border rounded bg-white shadow-sm" (change)="onTypeChange(i, $event)">
        @for (type of variableTypes; track type.value) {
          <option [value]="type.value" [selected]="type.value === variable.type">
            {{ type.label }}
          </option>
        }
      </select>

      @if (variables().length > 1) {
       <button
  class="p-1 rounded-lg"
  type="button"
  title="Remove Variable"
  (click)="removeVariable(i)">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="1.5"
    stroke="currentColor"
    class="size-5"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
    />
  </svg>
</button>
      }
    </div>
  }
  
  <button 
    class="mt-2 w-fit px-3 py-1.5 bg-white-500 text-black font-medium rounded hover" 
    (click)="addVariable()">
    + Add Variable
  </button>
</div>
